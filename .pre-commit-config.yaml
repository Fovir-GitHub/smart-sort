repos:
  - repo: local
    hooks:
      - id: clang-tidy
        name: Check Code Style
        entry: ./scripts/run-tidy.sh
        language: script
        pass_filenames: false
        types_or:
          - c
          - c++
      - id: clang-format
        name: Check Code Format
        entry: ./scripts/check-format.sh
        language: script
        pass_filenames: false
        types_or:
          - c
          - c++
